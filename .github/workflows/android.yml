name: RDS Vocabulary Game APK Builder
on:
  push:
    branches: [remake/full-rebuild]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    name: Build RDS Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Project
        uses: actions/checkout@v4
        with:
          ref: remake/full-rebuild
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: RDS_Vocabulary_Game_Project/package-lock.json
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract Original Project
        run: |
          unzip -q RDS_Vocabulary_Game_Project.zip
          test -f RDS_Vocabulary_Game_Project/src/main.jsx
      - name: Install Rebuilt App
        run: |
          cp -R remake/. RDS_Vocabulary_Game_Project/
          cp remake/package.json RDS_Vocabulary_Game_Project/package.json
          cp remake/capacitor.config.json RDS_Vocabulary_Game_Project/capacitor.config.json
          cp remake/firestore.rules RDS_Vocabulary_Game_Project/firestore.rules
      - name: Install Dependencies
        working-directory: RDS_Vocabulary_Game_Project
        run: npm install
      - name: Preserve Original Vocabulary and Firebase Config
        working-directory: RDS_Vocabulary_Game_Project
        run: node scripts/prepare-project.mjs
      - name: Build Web App
        working-directory: RDS_Vocabulary_Game_Project
        run: npm run build
      - name: Add Android Platform
        working-directory: RDS_Vocabulary_Game_Project
        run: npx cap add android
      - name: Sync Android
        working-directory: RDS_Vocabulary_Game_Project
        run: npx cap sync android
      - name: Build Debug APK
        working-directory: RDS_Vocabulary_Game_Project/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace
      - name: Rename APK
        run: |
          cp RDS_Vocabulary_Game_Project/android/app/build/outputs/apk/debug/app-debug.apk RDS-Vocabulary-Game.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RDS-Vocabulary-Game
          path: RDS-Vocabulary-Game.apk
          if-no-files-found: error
          retention-days: 14
