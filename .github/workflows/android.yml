
name: RDS Vocabulary Game APK Builder

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build RDS Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Download repository
      - name: Checkout Project
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 4. Extract original project
      - name: Extract Project ZIP
        run: |
          unzip -q RDS_Vocabulary_Game_Project.zip
          test -f RDS_Vocabulary_Game_Project/package.json
          test -f RDS_Vocabulary_Game_Project/capacitor.config.json

      # 5. Install project dependencies
      - name: Install Dependencies
        working-directory: RDS_Vocabulary_Game_Project
        run: |
          npm install
          npm pkg set scripts.build="vite build"

      # 6. Install Capacitor
      - name: Install Capacitor Android
        working-directory: RDS_Vocabulary_Game_Project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      # 7. Build website
      - name: Build Website
        working-directory: RDS_Vocabulary_Game_Project
        run: npm run build

      # 8. Create Android platform
      - name: Add Android Platform
        working-directory: RDS_Vocabulary_Game_Project
        run: npx cap add android

      # 9. Sync Android project
      - name: Sync Android
        working-directory: RDS_Vocabulary_Game_Project
        run: npx cap sync android

      # 10. Fix Kotlin duplicate classes
      - name: Fix Kotlin Dependencies
        working-directory: RDS_Vocabulary_Game_Project/android
        run: |
          cat >> build.gradle <<'EOF'

          allprojects {
              configurations.configureEach {
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

                  resolutionStrategy.force(
                      'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  )
              }
          }
          EOF

      # 11. Build Android APK
      - name: Build APK
        working-directory: RDS_Vocabulary_Game_Project/android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug

      # 12. Rename APK
      - name: Rename APK
        run: |
          cp RDS_Vocabulary_Game_Project/android/app/build/outputs/apk/debug/app-debug.apk \
          RDS-Vocabulary-Game.apk

      # 13. Upload final APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RDS-Vocabulary-Game
          path: RDS-Vocabulary-Game.apk
          if-no-files-found: error
          retention-days: 7
          
